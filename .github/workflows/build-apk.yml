name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js 22 ──────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 3. Java 17 ─────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 4. Install npm dependencies ────────────────────────
      - name: Install npm dependencies
        working-directory: mobile
        run: npm install

      # ── 5. Download gradle-wrapper.jar ─────────────────────
      #       This jar is a binary and cannot be stored in git.
      #       We download it directly from the official Gradle repo.
      - name: Download gradle-wrapper.jar
        run: |
          mkdir -p mobile/android/gradle/wrapper
          curl -fsSL \
            "https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar" \
            -o mobile/android/gradle/wrapper/gradle-wrapper.jar
          echo "✅ gradle-wrapper.jar downloaded"
          ls -lh mobile/android/gradle/wrapper/

      # ── 6. Cache Gradle ────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 7. Make gradlew executable ─────────────────────────
      - name: Make gradlew executable
        working-directory: mobile/android
        run: chmod +x gradlew

      # ── 8. Generate debug keystore ─────────────────────────
      - name: Generate debug keystore
        working-directory: mobile/android/app
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      # ── 9. Build APK ───────────────────────────────────────
      - name: Build Debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 10. Upload APK artifact ────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatApp-Debug-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 11. Show APK info ──────────────────────────────────
      - name: Show APK size
        run: |
          APK_PATH="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(du -sh "$APK_PATH" | cut -f1)
            echo "✅ APK built successfully!"
            echo "📦 APK size: $SIZE"
          else
            echo "❌ APK not found!"
            exit 1
          fi
