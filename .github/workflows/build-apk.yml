name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js 22 ──────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 3. Java 17 ─────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 4. Install npm dependencies ────────────────────────
      - name: Install npm dependencies
        working-directory: mobile
        run: npm install

      # ── 5. Download gradle-wrapper.jar ─────────────────────
      - name: Download gradle-wrapper.jar
        run: |
          mkdir -p mobile/android/gradle/wrapper
          curl -fsSL \
            "https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar" \
            -o mobile/android/gradle/wrapper/gradle-wrapper.jar
          echo "gradle-wrapper.jar size: $(du -sh mobile/android/gradle/wrapper/gradle-wrapper.jar)"

      # ── 6. Cache Gradle ────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── 7. Make gradlew executable ─────────────────────────
      - name: Make gradlew executable
        working-directory: mobile/android
        run: chmod +x gradlew

      # ── 8. Generate debug keystore ─────────────────────────
      - name: Generate debug keystore
        working-directory: mobile/android/app
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt
          echo "Keystore created: $(ls -lh debug.keystore)"

      # ── 9. Print build files for debugging ─────────────────
      - name: Show build files
        run: |
          echo "=== app/build.gradle ==="
          cat mobile/android/app/build.gradle
          echo "=== build.gradle ==="
          cat mobile/android/build.gradle
          echo "=== settings.gradle ==="
          cat mobile/android/settings.gradle
          echo "=== node_modules/@react-native/gradle-plugin exists? ==="
          ls mobile/node_modules/@react-native/gradle-plugin/ | head -10

      # ── 10. Build APK ──────────────────────────────────────
      - name: Build Debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --info 2>&1 | tail -100

      # ── 11. Upload APK ─────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatApp-Debug-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 12. APK info ───────────────────────────────────────
      - name: Show APK info
        run: |
          APK="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$APK" ] && echo "✅ APK: $(du -sh $APK)" || (echo "❌ APK not found" && exit 1)
