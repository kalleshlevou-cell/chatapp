name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js 22 ──────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 3. Java 17 ─────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 4. Scaffold clean RN 0.73.2 project ───────────────
      - name: Scaffold React Native project
        run: |
          npx react-native@0.73.2 init ChatAppBuild \
            --title "ChatApp" \
            --skip-install \
            --skip-git-init \
            --version 0.73.2
          echo "✅ Scaffold done"

      # ── 5. Install dependencies ────────────────────────────
      #   Use @react-navigation/stack (JS-only) to avoid
      #   react-native-screens native compilation issues on CI.
      - name: Install dependencies
        working-directory: ChatAppBuild
        run: |
          npm install \
            @react-native-async-storage/async-storage@1.21.0 \
            @react-navigation/native@6.1.9 \
            @react-navigation/stack@6.3.20 \
            axios@1.6.2 \
            socket.io-client@4.6.1 \
            react-native-gesture-handler@2.14.0 \
            react-native-safe-area-context@4.7.4 \
            react-native-screens@3.27.0 \
            react-native-reanimated@3.6.1
          echo "✅ Dependencies installed"

      # ── 6. Copy our source files ───────────────────────────
      - name: Copy source files
        run: |
          cp mobile/App.js    ChatAppBuild/App.js
          cp mobile/index.js  ChatAppBuild/index.js
          cp mobile/app.json  ChatAppBuild/app.json
          rm -rf              ChatAppBuild/src
          cp -r mobile/src    ChatAppBuild/src
          echo "✅ Source files copied"

      # ── 7. Cache Gradle ────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('ChatAppBuild/android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── 8. Make gradlew executable ─────────────────────────
      - name: Make gradlew executable
        working-directory: ChatAppBuild/android
        run: chmod +x gradlew

      # ── 9. Build APK ───────────────────────────────────────
      - name: Build Debug APK
        working-directory: ChatAppBuild/android
        run: ./gradlew assembleDebug --no-daemon

      # ── 10. Upload APK ─────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatApp-Debug-APK
          path: ChatAppBuild/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 11. APK info ───────────────────────────────────────
      - name: Show APK info
        run: |
          APK="ChatAppBuild/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            echo "✅ APK built successfully! Size: $(du -sh $APK | cut -f1)"
          else
            echo "❌ APK not found"; exit 1
          fi
