name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js 22 ──────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 3. Java 17 ─────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 4. Scaffold clean RN 0.73.2 project ───────────────
      - name: Scaffold React Native project
        run: |
          npx react-native@0.73.2 init ChatAppBuild \
            --title "ChatApp" \
            --skip-install \
            --skip-git-init \
            --version 0.73.2
          echo "✅ Scaffold done"

      # ── 5. Install dependencies ────────────────────────────
      - name: Install dependencies
        working-directory: ChatAppBuild
        run: |
          npm install \
            @react-native-async-storage/async-storage@1.21.0 \
            @react-navigation/native@6.1.9 \
            @react-navigation/stack@6.3.20 \
            axios@1.6.2 \
            socket.io-client@4.6.1 \
            react-native-gesture-handler@2.14.0 \
            react-native-safe-area-context@4.7.4 \
            react-native-screens@3.27.0 \
            react-native-reanimated@3.6.1
          echo "✅ Dependencies installed"

      # ── 6. Copy our source files ───────────────────────────
      - name: Copy source files
        run: |
          cp mobile/App.js    ChatAppBuild/App.js
          cp mobile/index.js  ChatAppBuild/index.js
          cp mobile/app.json  ChatAppBuild/app.json
          rm -rf              ChatAppBuild/src
          cp -r mobile/src    ChatAppBuild/src
          echo "✅ Source files copied"

      # ── 7. Cache Gradle ────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('ChatAppBuild/android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── 8. Make gradlew executable ─────────────────────────
      - name: Make gradlew executable
        working-directory: ChatAppBuild/android
        run: chmod +x gradlew

      # ── 9. Build APK ───────────────────────────────────────
      - name: Build Debug APK
        working-directory: ChatAppBuild/android
        run: ./gradlew assembleDebug --no-daemon

      # ── 10. Rename APK ─────────────────────────────────────
      - name: Rename APK
        run: |
          mkdir -p output
          cp ChatAppBuild/android/app/build/outputs/apk/debug/app-debug.apk \
             output/ChatApp-v1.0-debug.apk
          echo "✅ APK size: $(du -sh output/ChatApp-v1.0-debug.apk | cut -f1)"

      # ── 11. Upload APK as artifact ─────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatApp-Debug-APK
          path: output/ChatApp-v1.0-debug.apk
          retention-days: 30

      # ── 12. Create GitHub Release with APK ─────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: "ChatApp v1.0 (Build ${{ github.run_number }})"
          body: |
            ## 📱 ChatApp Android APK

            **Build:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}

            ### Install Instructions
            1. Download `ChatApp-v1.0-debug.apk` below
            2. Transfer to your Android phone
            3. Enable **Settings → Security → Install Unknown Apps**
            4. Tap the APK to install

            ### Features
            - ✅ Real-time chat with Socket.io
            - ✅ Multiple chat rooms
            - ✅ Online users list
            - ✅ Typing indicator
            - ✅ Chat history (MongoDB)
            - ✅ Login / Register / Guest mode

            ### Backend
            🌐 https://chatapp-hqgv.onrender.com
          files: output/ChatApp-v1.0-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
