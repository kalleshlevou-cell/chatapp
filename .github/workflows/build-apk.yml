name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js 22 ──────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 3. Java 17 ─────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 4. Install dependencies ────────────────────────────
      - name: Install npm dependencies
        working-directory: mobile
        run: npm install

      # ── 5. Cache Gradle ────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── 6. Make gradlew executable ─────────────────────────
      - name: Make gradlew executable
        working-directory: mobile/android
        run: chmod +x gradlew

      # ── 7. Bundle JavaScript ───────────────────────────────
      - name: Bundle JavaScript for Android
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/assets
          node node_modules/.bin/react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          echo "✅ Bundle size: $(du -sh android/app/src/main/assets/index.android.bundle | cut -f1)"

      # ── 8. Build APK ───────────────────────────────────────
      - name: Build Debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      # ── 9. Verify APK has JS bundle ────────────────────────
      - name: Verify APK contains JS bundle
        run: |
          APK=$(find mobile/android -name "app-debug.apk" | head -1)
          echo "APK: $APK  |  Size: $(du -sh $APK | cut -f1)"
          if unzip -l "$APK" | grep -q "index.android.bundle"; then
            echo "✅ JS bundle is inside the APK"
          else
            echo "❌ JS bundle NOT found in APK — listing assets:"
            unzip -l "$APK" | grep -i asset || echo "No assets"
            exit 1
          fi

      # ── 10. Rename APK ─────────────────────────────────────
      - name: Rename APK
        run: |
          mkdir -p output
          APK=$(find mobile/android -name "app-debug.apk" | head -1)
          cp "$APK" output/ChatApp-debug.apk
          echo "📦 Final APK: $(du -sh output/ChatApp-debug.apk | cut -f1)"

      # ── 11. Upload artifact ────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatApp-Debug-APK
          path: output/ChatApp-debug.apk
          retention-days: 30

      # ── 12. GitHub Release ─────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: "ChatApp v1.0 (Build ${{ github.run_number }})"
          body: |
            ## 📱 ChatApp Android APK

            ### Install
            1. Download `ChatApp-debug.apk` below
            2. Phone: Settings → Security → Install Unknown Apps → Enable
            3. Open APK → Install

            ### Live Backend
            🌐 https://chatapp-hqgv.onrender.com
          files: output/ChatApp-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
