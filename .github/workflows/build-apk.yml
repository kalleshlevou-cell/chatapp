name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js 22 ──────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 3. Java 17 ─────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 4. Scaffold clean RN 0.73.2 project ───────────────
      - name: Scaffold React Native project
        run: |
          npx react-native@0.73.2 init ChatAppBuild \
            --title "ChatApp" \
            --skip-install \
            --skip-git-init \
            --version 0.73.2
          echo "✅ Scaffold done"
          ls ChatAppBuild/

      # ── 5. Install dependencies ────────────────────────────
      - name: Install dependencies
        working-directory: ChatAppBuild
        run: |
          npm install \
            @react-native-async-storage/async-storage@1.21.0 \
            @react-navigation/native@6.1.9 \
            @react-navigation/stack@6.3.20 \
            axios@1.6.2 \
            socket.io-client@4.6.1 \
            react-native-gesture-handler@2.14.0 \
            react-native-safe-area-context@4.7.4 \
            react-native-screens@3.27.0 \
            react-native-reanimated@3.6.1
          echo "✅ node_modules installed"

      # ── 6. Copy our source files ───────────────────────────
      - name: Copy source files
        run: |
          cp -v mobile/App.js    ChatAppBuild/App.js
          cp -v mobile/index.js  ChatAppBuild/index.js
          cp -v mobile/app.json  ChatAppBuild/app.json
          rm -rf                 ChatAppBuild/src
          cp -rv mobile/src      ChatAppBuild/src
          echo "✅ Source files:"
          find ChatAppBuild/src -name "*.js" | head -20

      # ── 7. Create assets folder ────────────────────────────
      - name: Create assets folder
        run: |
          mkdir -p ChatAppBuild/android/app/src/main/assets
          echo "✅ Assets folder ready"

      # ── 8. Bundle JavaScript ───────────────────────────────
      - name: Bundle JavaScript for Android
        working-directory: ChatAppBuild
        run: |
          node node_modules/react-native/cli.js bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --reset-cache
          echo "✅ Bundle created"
          ls -lh android/app/src/main/assets/
          if [ ! -f android/app/src/main/assets/index.android.bundle ]; then
            echo "❌ BUNDLE NOT FOUND - failing build"
            exit 1
          fi
          BUNDLE_SIZE=$(du -sh android/app/src/main/assets/index.android.bundle | cut -f1)
          echo "📦 Bundle size: $BUNDLE_SIZE"

      # ── 9. Cache Gradle ────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('ChatAppBuild/android/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── 10. Make gradlew executable ────────────────────────
      - name: Make gradlew executable
        working-directory: ChatAppBuild/android
        run: chmod +x gradlew

      # ── 11. Build APK ──────────────────────────────────────
      - name: Build Debug APK
        working-directory: ChatAppBuild/android
        run: |
          ./gradlew assembleDebug --no-daemon
          echo "✅ Gradle build done"
          ls -lh app/build/outputs/apk/debug/ || echo "⚠️ No APK output found"

      # ── 12. Verify APK has bundle ──────────────────────────
      - name: Verify APK contains JS bundle
        run: |
          APK="ChatAppBuild/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "❌ APK file not found!"; exit 1
          fi
          # Check APK contains the bundle (APK is a zip)
          if unzip -l "$APK" | grep -q "index.android.bundle"; then
            echo "✅ index.android.bundle IS inside the APK"
          else
            echo "❌ index.android.bundle NOT found in APK!"
            unzip -l "$APK" | grep -i "assets" || echo "No assets found"
            exit 1
          fi
          echo "📦 APK size: $(du -sh $APK | cut -f1)"

      # ── 13. Rename APK ─────────────────────────────────────
      - name: Rename APK
        run: |
          mkdir -p output
          cp ChatAppBuild/android/app/build/outputs/apk/debug/app-debug.apk \
             output/ChatApp-v1.0-debug.apk

      # ── 14. Upload APK artifact ────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatApp-Debug-APK
          path: output/ChatApp-v1.0-debug.apk
          retention-days: 30

      # ── 15. Create GitHub Release ──────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: "ChatApp v1.0 (Build ${{ github.run_number }})"
          body: |
            ## 📱 ChatApp Android APK — with JS Bundle fix

            **Build:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}

            ### Install Instructions
            1. Download `ChatApp-v1.0-debug.apk` below
            2. Transfer to your Android phone
            3. Enable **Settings → Security → Install Unknown Apps**
            4. Tap the APK to install

            ### Features
            - ✅ Real-time chat with Socket.io
            - ✅ Multiple chat rooms
            - ✅ Online users list
            - ✅ Typing indicator
            - ✅ Chat history (MongoDB)
            - ✅ Login / Register / Guest mode

            ### Backend
            🌐 https://chatapp-hqgv.onrender.com
          files: output/ChatApp-v1.0-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
